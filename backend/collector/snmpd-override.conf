# /etc/systemd/system/snmpd.service.d/smi.conf
# O snmpd escuta no IP do Tailscale; no boot ele pode subir antes desse IP existir.
# Isto faz o systemd esperar o Tailscale e tentar de novo se o bind falhar.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
Restart=on-failure
RestartSec=10
