# /etc/snmp/snmpd.conf para o SMI
# - escuta SOMENTE no IP do Tailscale (não fica exposto na internet);
# - somente leitura, só SNMPv3 com autenticação e criptografia (sem community/v2c);
# - expõe só o que o SMI usa (CPU, memória, discos, uptime, sensores).
# Troque TAILSCALE_IP_DA_VPS pelo resultado de: tailscale ip -4
# Atenção: o snmpd NÃO aceita comentário no fim de uma linha de configuração,
# só em linha própria (começando com #).

agentaddress udp:TAILSCALE_IP_DA_VPS:161

# O que o SMI pode ler (nada além disso):
# system (descrição e nome do servidor)
view smiview included .1.3.6.1.2.1.1
# hrSystem (uptime)
view smiview included .1.3.6.1.2.1.25.1
# hrStorage (memória e partições)
view smiview included .1.3.6.1.2.1.25.2
# hrProcessorLoad (CPU)
view smiview included .1.3.6.1.2.1.25.3.3
# memória (UCD-SNMP-MIB)
view smiview included .1.3.6.1.4.1.2021.4
# lm-sensors (vazio em VPS)
view smiview included .1.3.6.1.4.1.2021.13.16

# Usuário "smi": somente leitura, exige autenticação + criptografia (priv).
# O usuário é criado com createUser em /var/lib/snmp/snmpd.conf (ver GUIA-VPS.md).
rouser smi priv -V smiview

# Menos ruído no log
dontLogTCPWrappersConnects yes
